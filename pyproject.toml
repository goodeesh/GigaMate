[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gigamate"
dynamic = ["version"]
description = "GigaMate — Gigabyte laptop management for Linux"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "adriansc"},
    {name = "GigaMate Contributors"},
]
keywords = ["gigabyte", "aero", "keyboard", "rgb", "fan", "acpi", "gimate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Hardware :: Hardware Drivers",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.8"
dependencies = [
    "pyusb>=1.2",
    # evdev 2.x needs Python >=3.11; 1.9.x covers 3.8+ (idle.py only
    # needs it optionally, so any 1.9+ API is fine).
    "evdev>=1.9",
    "PyQt6>=6.4",
]

[project.scripts]
gigamate = "gigamate.cli:main"
gigamate-tray = "gigamate.tray:main"
gigamate-center = "gigamate.ui:run_gui"
gigamate-dgpu-watch = "gigamate.dgpu_tune:run_watcher"
# Legacy backward-compat aliases:
gigabyte-rgb = "gigamate.cli:main"
gigabyte-rgb-tray = "gigamate.tray:main"

[project.urls]
Homepage = "https://github.com/goodeesh/GigaMate"
Issues = "https://github.com/goodeesh/GigaMate/issues"
Repository = "https://github.com/goodeesh/GigaMate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "gigamate.__version__"}

[tool.setuptools.package-data]
gigamate = ["profile_data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
