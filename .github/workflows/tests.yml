name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    # Pinned rather than ubuntu-latest: when the `latest` alias rolled over to
    # Ubuntu 26.04, actions/python-versions had no builds for the older
    # interpreters below, so those legs failed during setup and never ran a test.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.8 and 3.9 are EOL upstream and no longer have runner builds.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 \
            python3-gi gir1.2-gtk-3.0 gir1.2-appindicator3-0.1 \
            python3-usb python3-evdev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run tests
        run: |
          python -m pytest tests/ -v -rs --strict-markers

      - name: Verify tray imports on system Python (has PyGObject)
        run: |
          /usr/bin/python3 -c "import gi; gi.require_version('Gtk','3.0'); import sys; sys.path.insert(0,'src'); import gigamate.tray; print('tray imports OK')"

  validate-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test deps
        run: |
          pip install pytest
          pip install -e .
      - name: Validate all built-in profiles
        run: python -m pytest tests/ -v -k "TestValidate"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (fatal errors only)
        run: |
          pip install ruff
          ruff check src tests --select E9,F63,F7,F82

  kernel-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-$(uname -r) || \
            sudo apt-get install -y build-essential linux-headers-generic
      - name: Compile kernel module
        run: |
          if [ ! -d "/lib/modules/$(uname -r)/build" ]; then
            echo "No kernel headers available; skipping module compile."
            exit 0
          fi
          make -C src/gigamate_acpi

